<text x="340" y="174" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Built via docker build</text>
<line x1="340" y1="192" x2="340" y2="232" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<text x="40" y="272" text-anchor="start" font-family="sans-serif" font-size="12" fill="#5F5E5A">FASTA test files</text>
<line x1="140" y1="266" x2="206" y2="266" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="210" y="232" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="252" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Container run</text>
<text x="340" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">docker run, -v mount to /app</text>
<line x1="340" y1="288" x2="340" y2="328" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="328" width="260" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Parser execution</text>
<text x="340" y="366" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">FASTA validation logic</text>
<line x1="340" y1="384" x2="340" y2="424" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="210" y="424" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="444" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Output</text>
<text x="340" y="462" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Valid seqs / errors caught</text>

<text x="340" y="510" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Tested against missing, empty, garbage, and bad-character FASTA files</text>
